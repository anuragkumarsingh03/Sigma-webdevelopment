<body>
    <!-- 
    write a program to calculate factorial of a number using reduce and using for loops
     -->
    <script>
// Factorial using a loop
let num = 6;
let factorial = 1;

for (let i = 1; i <= num; i++) {
    factorial *= i;
}

console.log("Factorial of " + num + " is: " + factorial);

    </script>
</body>
