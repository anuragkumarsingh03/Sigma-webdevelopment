<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Selectors </title>
    <style>
        /* element selector */
        div {
            background-color: red;
        }

        /* Class selector */
        .red {
            background-color: green;
        }

        /*ID selector */
        #yellow {
            background-color: yellow;
        }

        /* Child selector */
        div>p {
            color: brown;
            background-color: aqua;
        }
        /* decendent selector  */
        div p {
            background-color: blueviolet;
        }
        /* universal selector */
        *{
            margin:0;
            padding:0;
        }
        /* pseudo selectors */
        a:visited {
    color: #8b2d1a;  
    }
    a: :active {
        background-color: red;
    }
    a: :hover {
        background-color: yellow;
    }


    </style>
</head>

<body>
    <h2>
        <div class="red">
            i am the best
        </div>

        <div>
            i know you
            <article>
                <p> i am in the paragraph that is the best in the </p>
            </article>   
            </div> 
        <div id="yellow">
            what the best things to do
        </div>

    <a href="https://www.google.com">go to google</a>
    </h2>
</body>

</html>
